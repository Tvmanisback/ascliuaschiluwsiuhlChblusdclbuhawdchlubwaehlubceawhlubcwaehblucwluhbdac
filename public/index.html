<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascendant</title>
  <style>
    body { margin: 0; background: #0a0a12; color: #e0e0ff; font-family: system-ui, sans-serif; }
    #ui { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.6); padding: 12px 16px; border-radius: 8px; }
    canvas { display: block; width: 100vw; height: 100vh; }
    button { margin: 4px 0; padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>Ascendant</h2>
    <div>Movement: C++ WASM (Gorilla-style)</div>
    <div id="status">Loading...</div>
    <button id="loginBtn">Login (PlayFab)</button>
    <button id="resetBtn">Reset Position</button>
  </div>
  <canvas id="canvas"></canvas>

  <script type="module">
    import { CONFIG } from '../js/config.js';
    import { loginWithCustomId } from '../js/playfab.js';
    import { preparePhotonAuth } from '../js/photon.js';

    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let module = null;
    let statePtr = null;
    let playFabSession = null;
    let photonAuth = null;

    // Simple visual representation
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    async function loadWasm() {
      // Placeholder - replace with actual Emscripten output
      // After building with emcc you will get gorilla_movement.js + .wasm
      statusEl.textContent = 'WASM not built yet. Run the build steps in README.';
      // Example of how it will look once built:
      /*
      module = await createGorillaModule();
      statePtr = module._malloc(module.HEAPU8.byteLength ? 128 : 128); // size of GorillaState
      module._gorilla_init(statePtr);
      */
    }

    document.getElementById('loginBtn').onclick = async () => {
      try {
        statusEl.textContent = 'Logging into PlayFab...';
        const customId = 'player_' + Math.random().toString(36).slice(2, 10);
        const login = await loginWithCustomId(customId);
        playFabSession = login;
        statusEl.textContent = `PlayFab OK: ${login.PlayFabId}`;

        statusEl.textContent = 'Getting Photon tokens...';
        photonAuth = await preparePhotonAuth(login.SessionTicket, login.PlayFabId);
        statusEl.textContent = `Ready. Realtime + Chat App tokens obtained.`;
        console.log('Photon Auth:', photonAuth);
      } catch (e) {
        statusEl.textContent = 'Error: ' + e.message;
        console.error(e);
      }
    };

    document.getElementById('resetBtn').onclick = () => {
      if (module && statePtr) {
        module._gorilla_reset(statePtr, 0, 1.6, 0);
      }
    };

    // Fake movement loop for visual feedback until WASM is compiled
    let fakeY = 1.6;
    function loop() {
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);

      // Player representation
      const px = canvas.width / 2;
      const py = canvas.height * 0.7 - fakeY * 40;
      ctx.fillStyle = '#7c5cff';
      ctx.beginPath();
      ctx.arc(px, py, 18, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }
    loop();

    loadWasm();
  </script>
</body>
</html>
